# Toolchain comes from the Nix dev shell (flake.nix, loaded by direnv via .envrc).
# mise only holds project env vars and task shortcuts.

[env]
CMAKE_GENERATOR = "Ninja"
CMAKE_EXPORT_COMPILE_COMMANDS = "ON"

[tasks.configure]
description = "Configure a debug build with tests and examples in ./build"
run = "cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DSDL_TESTS=ON -DSDL_EXAMPLES=ON"

[tasks.build]
description = "Build SDL, tests and examples"
depends = ["configure"]
run = "cmake --build build"

[tasks.test]
description = "Run the non-interactive CTest suite (extra args go to ctest)"
depends = ["build"]
run = "ctest --test-dir build -j4 --output-on-failure"

[tasks."test:auto"]
description = "Run testautomation: mise run test:auto -- --filter <suite|test>"
depends = ["build"]
dir = "build/test"
run = "./testautomation"

[tasks.dynapi]
description = "Regenerate the dynamic API tables after changing public functions"
run = "python3 src/dynapi/gendynapi.py"

[tasks.format]
description = "Format changed C sources with clang-format"
run = "build-scripts/clang-format-src.sh"

[tasks.tla]
description = "Model-check TLA+ specs: <spec>/MC.cfg must pass; each <spec>/mutants/*.cfg must fail on its EXPECT property"
run = '''
#!/usr/bin/env bash
set -euo pipefail
shopt -s nullglob
cd verification/tla 2>/dev/null || { echo "No specs in verification/tla yet"; exit 0; }
meta=$(mktemp -d)
trap 'rm -rf "$meta"' EXIT
cfgs=(*/MC.cfg)
[ -n "${cfgs[*]:-}" ] || { echo "No specs in verification/tla yet"; exit 0; }
# usage: check <dir> <cfg relative to dir> <output file>; returns TLC's exit status
check() { (cd "$1" && tlc -config "$2" -workers auto -metadir "$3.meta" MC.tla) > "$3" 2>&1; }
status=0
for mc in "${cfgs[@]}"; do
  dir="${mc%/MC.cfg}"
  echo "== $dir"
  # Every top-level config (MC.cfg, MC_*.cfg) describes the real code and must pass.
  for c in "$dir"/*.cfg; do
    name=$(basename "$c" .cfg); out="$meta/$dir-$name.out"
    if check "$dir" "$name.cfg" "$out"; then
      echo "  PASS     $name: $(grep -E '^[0-9]+ states generated' "$out")"
    else
      echo "  FAIL     $name"; grep -E "^Error" "$out" || tail -20 "$out"; status=1
    fi
  done
  # mutants/*.cfg (deliberately broken models) and findings/*.cfg (real-code
  # counterexamples we keep reproducible) must fail on the property named in
  # "\* EXPECT: <Invariant>", or "Temporal" / "Deadlock".
  for c in "$dir"/mutants/*.cfg "$dir"/findings/*.cfg; do
    kind=$(basename "$(dirname "$c")"); name=$(basename "$c" .cfg)
    expect=$(sed -n 's/^\\\* EXPECT: *//p' "$c" | head -1)
    case "$expect" in
      Temporal) pat="Temporal properties were violated" ;;
      Deadlock) pat="Deadlock reached" ;;
      *)        pat="Invariant $expect is violated" ;;
    esac
    out="$meta/$dir-$kind-$name.out"
    if check "$dir" "$kind/$name.cfg" "$out"; then
      echo "  MISSED   $kind/$name: expected '$pat'"; status=1
    elif grep -q "$pat" "$out"; then
      echo "  ok       $kind/$name fails as expected: $pat"
    else
      echo "  WRONG    $kind/$name failed differently:"; grep -E "^Error" "$out" | head -3; status=1
    fi
  done
done
exit $status
'''

[tasks.lean]
description = "Check the Lean proofs, their axioms, and the proof mutants in verification/lean"
dir = "verification/lean"
run = '''
#!/usr/bin/env bash
set -euo pipefail
log=$(mktemp); trap 'rm -f "$log"' EXIT
lake build -q > "$log" 2>&1 || { grep -v "ld64.lld: warning" "$log"; exit 1; }
echo "proofs:  all theorems check"
# Only the standard axioms and bv_decide's natively checked LRAT certificates are allowed.
lake env lean test/Axioms.lean > "$log" 2>&1
bad=$(tr ',[]' '\n\n\n' < "$log" | sed 's/^ *//' | grep -vE "depends on axioms:|does not depend on any axioms$|^$|^propext$|^Classical\.choice$|^Quot\.sound$|\._native\.bv_decide\.ax_" || true)
if [ -n "$bad" ]; then echo "axioms:  UNEXPECTED: $bad"; exit 1; fi
echo "axioms:  $(grep -cE 'depends on axioms|does not depend on any axioms' "$log") theorems, no sorry, only standard + bv_decide certificate axioms"
echo "mutants:"
test/mutants.sh
'''

[tasks."lean:diff"]
description = "Differential tests of the Lean models against the real SDL build (UTF-8 grid + fuzz corpus, rect functions)"
depends = ["build"]
dir = "verification/lean"
run = "test/utf8_diff.sh ../../build && test/utf8_corpus.sh ../../build && test/rect_diff.sh ../../build 200000 && test/gamepad_diff.sh ../../build 20000"

# Sanitizer builds use Apple's clang: on macOS 27 the nix clang 21 ASan runtime hangs at
# startup, even for a plain hello world. Inside the dev shell, /usr/bin/clang is an xcrun shim
# that follows DEVELOPER_DIR/SDKROOT to the nix SDK, so both are reset for these tasks.
[tasks."asan:build"]
description = "Build SDL with ASan+UBSan into ./build-asan (Apple clang on macOS, nix clang elsewhere)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
san="-fsanitize=address,undefined -fno-omit-frame-pointer"
if [ "$(uname -s)" = Darwin ]; then
  dev=$(env -u DEVELOPER_DIR xcode-select -p)
  run() { env -u SDKROOT DEVELOPER_DIR="$dev" "$@"; }
  cc=(-DCMAKE_C_COMPILER=/usr/bin/clang -DCMAKE_OBJC_COMPILER=/usr/bin/clang -DCMAKE_CXX_COMPILER=/usr/bin/clang++)
else
  run() { "$@"; }
  cc=()
fi
run cmake -S . -B build-asan -G Ninja "${cc[@]}" -DCMAKE_BUILD_TYPE=Debug \
  -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF -DSDL_STATIC=OFF \
  "-DCMAKE_C_FLAGS=$san" "-DCMAKE_OBJC_FLAGS=$san" "-DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=address,undefined"
run cmake --build build-asan
'''

[tasks.repro]
description = "Run the FINDINGS.md lead reproductions against ./build-asan: mise run repro -- <mode>"
depends = ["asan:build"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
if [ "$(uname -s)" = Darwin ]; then cc() { env -u SDKROOT -u DEVELOPER_DIR /usr/bin/clang "$@"; }; fi
cc -g -fsanitize=address,undefined -fno-omit-frame-pointer -I include verification/harness/repro_leads.c \
  -L build-asan -lSDL3 -Wl,-rpath,"$PWD/build-asan" -o build-asan/repro_leads
modes=("$@"); [ -n "${modes[*]:-}" ] || modes=(utf8-range utf8-null utf8-strcasecmp gamepad gamepad-joy gamepad-empty gamepad-sign mapping-empty)
for m in "${modes[@]}"; do
  echo "===== $m"
  build-asan/repro_leads "$m" 2>&1 | grep -E "^(utf8|gamepad|mapping)|ERROR: AddressSanitizer|READ of size|    #[0-4] |overflows this variable|is located 0 bytes" || true
done
'''

[tasks."repro:wakeup"]
description = "F-019: stress SDL_WaitEventTimeout against a pushing thread; counts waits that time out with an event queued (args: [rounds] [max_delay_us])"
depends = ["build"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
cc -O1 -I include verification/harness/repro_wakeup.c -L build -lSDL3 -Wl,-rpath,"$PWD/build" -o build/repro_wakeup
build/repro_wakeup "${1:-300000}" "${2:-20}" || true
'''

[tasks."repro:verify"]
description = "Reproduce every finding on the pre-fix tree and check the fix removes it (verification/repro): mise run repro:verify -- [program ...]"
run = "verification/repro/run.sh"

[tasks.cbmc]
description = "CBMC bounded model checking of src/stdlib on the current, pre-fix and mutated trees (verification/cbmc): mise run cbmc -- [harness ...]"
run = "verification/cbmc/run.sh"

[tasks.trace]
description = "TLA+ trace validation: record real runs of the instrumented SDL and replay them in tla/audio_device and tla/events_wait"
run = '''
#!/usr/bin/env bash
set -euo pipefail
verification/instrument/trace_check.sh audio_device 30
verification/instrument/trace_check.sh events_wait 300
'''

# Phase 3 fuzz harnesses (verification/harness/README.md). SDL is built with Apple clang +
# ASan/UBSan + libFuzzer coverage into ./build-fuzz and linked with the nix clang's libFuzzer
# runtime, since Apple clang ships none and nix clang's ASan hangs on macOS 27.
[tasks."fuzz:build"]
description = "Build the coverage-instrumented ASan/UBSan SDL and the six fuzz targets into ./build-fuzz"
run = "verification/harness/fuzz.sh build"

[tasks.fuzz]
description = "Fuzz every target for N seconds each (default 300): mise run fuzz -- 600"
depends = ["fuzz:build"]
run = '''
#!/usr/bin/env bash
verification/harness/fuzz.sh run-all "${1:-300}"
'''

[tasks."fuzz:regress"]
description = "Replay the regression inputs (each must reproduce its finding with SDL_FUZZ_KNOWN=1) and the corpora"
depends = ["fuzz:build"]
run = "verification/harness/regress.sh"
