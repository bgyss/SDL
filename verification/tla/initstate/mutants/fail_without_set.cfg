\* EXPECT: TransitionHasOwner
\* Owner returns from a failed init without SDL_SetInitialized: status is stuck in
\* INITIALIZING and every later ShouldInit/ShouldQuit caller spins forever.
CONSTANTS
    Threads = {t1, t2, t3}
    MaxOps = 2
    MUTANT = "fail_without_set"
SPECIFICATION Spec
INVARIANTS TypeOK MutualExclusion OwnerMatchesStatus SetInitializedAssert TransitionHasOwner
PROPERTIES Termination
