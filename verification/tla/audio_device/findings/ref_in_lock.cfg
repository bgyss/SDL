\* EXPECT: NoUseAfterFree
\* The obvious fix is not enough: taking the reference inside the read lock still races with
\* UnrefPhysicalAudioDevice, which decrements to 0 *before* taking the write lock to remove
\* the device. A lookup in between finds it with count 0, resurrects it to 1, and then the
\* unref path frees it anyway.
CONSTANTS
    Lookers = {l1}
    OPEN = FALSE
    FIX = "ref_in_lock"
    MUTANT = "none"
SPECIFICATION Spec
INVARIANTS TypeOK NoUseAfterFree FreedImpliesUnhashed
PROPERTIES Termination
