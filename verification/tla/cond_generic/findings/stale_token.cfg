\* EXPECT: NoStaleToken
\* Real code. A waiter that is signalled but times out before taking the token
\* still acknowledges the signal (num_signals--), leaving a token in cond->sem
\* that no outstanding signal accounts for. The next waiter returns "signalled"
\* immediately without any new Signal/Broadcast: a spurious wakeup.
CONSTANTS
    Consumers = {c1, c2}
    Producers = {p1, p2}
    CLIENT = "tickets"
    TIMEOUTS = TRUE
    MUTANT = "none"
SPECIFICATION Spec
INVARIANTS TypeOK CountsOK SignalSemIsLock NoStaleToken
PROPERTIES Termination
