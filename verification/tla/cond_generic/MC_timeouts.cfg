\* Real code, tickets client, waits may time out at any point: 2 consumers, 2 producers.
\* NoStaleToken is left out on purpose: it fails with timeouts (findings/stale_token.cfg).
CONSTANTS
    Consumers = {c1, c2}
    Producers = {p1, p2}
    CLIENT = "tickets"
    TIMEOUTS = TRUE
    MUTANT = "none"
SPECIFICATION Spec
INVARIANTS TypeOK CountsOK SignalSemIsLock
PROPERTIES Termination
