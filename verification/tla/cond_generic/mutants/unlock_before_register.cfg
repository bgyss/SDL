\* EXPECT: Deadlock
\* Waiter unlocks the user mutex before num_waiting++: a producer can signal in
\* the gap, see no waiters, and the waiter sleeps forever (classic lost wakeup).
CONSTANTS
    Consumers = {c1, c2}
    Producers = {p1, p2}
    CLIENT = "tickets"
    TIMEOUTS = FALSE
    MUTANT = "unlock_before_register"
SPECIFICATION Spec
INVARIANTS TypeOK CountsOK SignalSemIsLock NoStaleToken
PROPERTIES Termination
