\* Trace validation of the fixed code (FIX = TRUE is what src/ now does), timed waits.
\* Used by verification/instrument/trace_check.sh with a generated TraceData.tla.
CONSTANTS
    Producers <- TraceProducers
    TIMED = TRUE
    FIX = TRUE
    MUTANT = "none"
INIT TraceInit
NEXT TraceNext
INVARIANTS TypeOK Conservation NoLostWakeup TraceIncomplete
