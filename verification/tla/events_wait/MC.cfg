\* Real code, timed waits (SDL_WaitEventTimeout): 3 producers, one event each. Every event is
\* delivered exactly once; a lost wakeup only delays delivery until the timeout (see
\* findings/lost_wakeup_timed.cfg).
CONSTANTS
    Producers = {p1, p2, p3}
    TIMED = TRUE
    FIX = FALSE
    MUTANT = "none"
SPECIFICATION Spec
INVARIANTS TypeOK Conservation
PROPERTIES AllDelivered
