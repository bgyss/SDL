\* EXPECT: NoLostWakeup
\* The fix needs latching backends: if a wakeup posted between the queue check and the start of
\* the backend wait were dropped, the fix would lose it too.
CONSTANTS
    Producers = {p1, p2}
    TIMED = FALSE
    FIX = TRUE
    MUTANT = "no_latch"
SPECIFICATION Spec
INVARIANTS TypeOK Conservation NoLostWakeup
PROPERTIES AllDelivered
