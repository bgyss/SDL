\* EXPECT: Temporal
\* Peep may ignore a queued event; with timed waits the waiter can loop forever without
\* delivering it, so AllDelivered fails.
CONSTANTS
    Producers = {p1}
    TIMED = TRUE
    FIX = FALSE
    MUTANT = "peep_may_skip"
SPECIFICATION Spec
INVARIANTS TypeOK Conservation
PROPERTIES AllDelivered
