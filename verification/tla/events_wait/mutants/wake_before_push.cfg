\* EXPECT: NoLostWakeup
\* Producer sends the wakeup before pushing the event: the waiter can wake, find nothing, and
\* go back to sleep before the event arrives.
CONSTANTS
    Producers = {p1, p2}
    TIMED = FALSE
    FIX = TRUE
    MUTANT = "wake_before_push"
SPECIFICATION Spec
INVARIANTS TypeOK Conservation NoLostWakeup
PROPERTIES AllDelivered
