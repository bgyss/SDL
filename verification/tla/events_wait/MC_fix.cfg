\* Current code (src/ since cce7d368b; this was the model fix for F-019): publish wakeup_window before the last queue check. With an
\* untimed SDL_WaitEvent and 3 producers, no wakeup is lost and every event is delivered.
CONSTANTS
    Producers = {p1, p2, p3}
    TIMED = FALSE
    FIX = TRUE
    MUTANT = "none"
SPECIFICATION Spec
INVARIANTS TypeOK Conservation NoLostWakeup
PROPERTIES AllDelivered
